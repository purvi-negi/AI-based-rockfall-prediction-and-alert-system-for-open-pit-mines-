spring.application.name=api-gateway



server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.main.web-application-type=reactive

spring.cloud.gateway.server.webflux.routes[0].id=data-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://DATA-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/mines/**,/api/sensors/**,/api/dashboard/**,/api/monitoring-snapshots/**,/api/alerts/**

spring.cloud.gateway.server.webflux.routes[1].id=prediction-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PREDICTION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/predictions/**

jwt.secret=${JWT_SECRET:}

